/**

 * APPLICATION STATE & CONTROLLER
 * ============================================================================
 */
const app = {
  state: {
    view: 'home', // 'home' | 'quiz' | 'result'
    mode: 'full', // 'full' | 'listening' | 'reading' | 'vocab'
    questions: [],
    currentIndex: 0,
    answers: {}, // { questionId: 'A' }
    flagged: {}, // { questionId: true }
    playCounts: {}, // { questionId: 0..2 }
    speechRate: 0.95,
    isSpeaking: false,
    timerEnabled: true,
    secondsRemaining: 1200, // 20 mins for full test
    timerInterval: null,
    xp: parseInt(localStorage.getItem('gept_inter_xp') || '120', 10),
    reviewFilter: 'all' // 'all' | 'wrong'
  },

  init() {
    this.updateXPDisplay();
    this.render();
    // Stop speech when leaving or reloading
    window.addEventListener('beforeunload', () => {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    });
  },

  updateXPDisplay() {
    const el = document.getElementById('xp-display');
    if (el) el.textContent = this.state.xp;
  },

  addXP(points) {
    this.state.xp += points;
    localStorage.setItem('gept_inter_xp', this.state.xp.toString());
    this.updateXPDisplay();
  },

  showToast(msg, icon = '💡') {
    const box = document.getElementById('toast-box');
    document.getElementById('toast-message').textContent = msg;
    document.getElementById('toast-icon').textContent = icon;
    box.classList.remove('translate-y-20', 'opacity-0');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => {
      box.classList.add('translate-y-20', 'opacity-0');
    }, 3000);
  },

  stopAudio() {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
    this.state.isSpeaking = false;
    const wave = document.getElementById('audio-wave');
    if (wave) wave.classList.add('hidden');
  },

  playQuestionAudio(qId) {
    if (!('speechSynthesis' in window)) {
      this.showToast('你的瀏覽器不支援語音朗讀功能，建議使用 Chrome 或 Edge 瀏覽器。', '⚠️');
      return;
    }

    const q = this.state.questions.find(item => item.id === qId);
    if (!q || !q.audioScript) return;

    const currentPlays = this.state.playCounts[qId] || 0;
    if (currentPlays >= 2) {
      this.showToast('擬真測驗每題最多播放 2 次喔！（已達上限）', '🎧');
      return;
    }

    this.stopAudio();
    this.state.playCounts[qId] = currentPlays + 1;
    this.state.isSpeaking = true;

    // Update UI counter immediately
    const countBadge = document.getElementById('play-count-text');
    if (countBadge) {
      const left = 2 - this.state.playCounts[qId];
      countBadge.textContent = left > 0 ? `剩餘播放次數：${left} 次` : '已無剩餘播放次數';
    }
    const wave = document.getElementById('audio-wave');
    if (wave) wave.classList.remove('hidden');

    const voices = window.speechSynthesis.getVoices();
    const enVoices = voices.filter(v => v.lang.startsWith('en'));
    const femaleVoice = enVoices.find(v => v.name.includes('Female') || v.name.includes('Samantha') || v.name.includes('Zira') || v.name.includes('Google US English')) || enVoices[0];
    const maleVoice = enVoices.find(v => v.name.includes('Male') || v.name.includes('David') || v.name.includes('Daniel') || v.name.includes('Google UK English Male')) || enVoices[1] || enVoices[0];

    let idx = 0;
    const speakNext = () => {
      if (idx >= q.audioScript.length || !this.state.isSpeaking) {
        this.state.isSpeaking = false;
        const w = document.getElementById('audio-wave');
        if (w) w.classList.add('hidden');
        return;
      }

      const line = q.audioScript[idx];
      const utter = new SpeechSynthesisUtterance(line.text);
      utter.lang = 'en-US';
      utter.rate = this.state.speechRate;

      // Differentiate speakers by voice & pitch
      if (line.speaker === 'Man' || line.speaker === 'Boy') {
        if (maleVoice) utter.voice = maleVoice;
        utter.pitch = 0.92;
      } else if (line.speaker === 'Woman' || line.speaker === 'Girl') {
        if (femaleVoice) utter.voice = femaleVoice;
        utter.pitch = 1.12;
      } else {
        if (femaleVoice) utter.voice = femaleVoice;
        utter.pitch = 1.0;
      }

      utter.onend = () => {
        idx++;
        setTimeout(speakNext, 350);
      };
      utter.onerror = () => {
        this.state.isSpeaking = false;
      };

      window.speechSynthesis.speak(utter);
    };

    speakNext();
  },

  toggleSpeechRate() {
    this.state.speechRate = this.state.speechRate === 0.95 ? 0.8 : 0.95;
    const label = this.state.speechRate === 0.95 ? '標準語速 (1.0x)' : '練習慢速 (0.8x)';
    this.showToast(`已切換為：${label}`, '🐢');
    this.render();
  },

  toggleTimerSetting() {
    this.state.timerEnabled = !this.state.timerEnabled;
    this.render();
  },

  startTimer(seconds) {
    clearInterval(this.state.timerInterval);
    const timerBox = document.getElementById('header-timer-box');
    if (!this.state.timerEnabled) {
      timerBox.classList.add('hidden');
      timerBox.classList.remove('flex');
      return;
    }

    this.state.secondsRemaining = seconds;
    timerBox.classList.remove('hidden');
    timerBox.classList.add('flex');
    this.updateTimerText();

    this.state.timerInterval = setInterval(() => {
      this.state.secondsRemaining--;
      this.updateTimerText();
      if (this.state.secondsRemaining <= 0) {
        clearInterval(this.state.timerInterval);
        this.showToast('時間到！系統已自動為你交卷。', '⏰');
        this.submitQuiz();
      }
    }, 1000);
  },

  updateTimerText() {
    const m = Math.floor(this.state.secondsRemaining / 60);
    const s = this.state.secondsRemaining % 60;
    const el = document.getElementById('timer-display');
    if (el) {
      el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }
  },

  startQuiz(mode) {
    this.stopAudio();
    this.state.mode = mode;
    this.state.answers = {};
    this.state.flagged = {};
    this.state.playCounts = {};
    this.state.currentIndex = 0;

    let selected = [];
    let duration = 1200; // 20 mins

    if (mode === 'full') {
      selected = [...QUESTION_BANK];
      duration = 1200;
    } else if (mode === 'listening') {
      selected = QUESTION_BANK.filter(q => q.module === 'listening');
      duration = 480; // 8 mins
    } else if (mode === 'reading') {
      selected = QUESTION_BANK.filter(q => q.module === 'reading');
      duration = 720; // 12 mins
    } else if (mode === 'vocab') {
      selected = QUESTION_BANK.filter(q => q.part === '詞彙與結構');
      duration = 360; // 6 mins
    }

    this.state.questions = selected;
    this.state.view = 'quiz';
    this.startTimer(duration);
    this.render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  },

  selectOption(qId, optLabel) {
    this.state.answers[qId] = optLabel;
    this.render();
  },

  toggleFlag(qId) {
    if (this.state.flagged[qId]) {
      delete this.state.flagged[qId];
    } else {
      this.state.flagged[qId] = true;
    }
    this.render();
  },

  goToQuestion(index) {
    if (index >= 0 && index < this.state.questions.length) {
      this.stopAudio();
      this.state.currentIndex = index;
      this.render();
    }
  },

  confirmSubmit() {
    const total = this.state.questions.length;
    const answered = Object.keys(this.state.answers).length;
    const modal = document.getElementById('confirm-modal');
    const title = document.getElementById('modal-title');
    const desc = document.getElementById('modal-desc');
    const btn = document.getElementById('modal-confirm-btn');

    if (answered < total) {
      title.textContent = '還有題目未完成喔！';
      desc.textContent = `你已完成 ${answered} / ${total} 題，確定要現在交卷並查看成績與詳解嗎？`;
    } else {
      title.textContent = '太棒了！全部作答完畢';
      desc.textContent = `你已完成全部 ${total} 題，準備好看看你的中級英檢戰力分析與詳解了嗎？`;
    }

    btn.onclick = () => {
      this.closeModal();
      this.submitQuiz();
    };

    modal.classList.remove('hidden');
    modal.classList.add('flex');
  },

  closeModal() {
    const modal = document.getElementById('confirm-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  },

  submitQuiz() {
    this.stopAudio();
    clearInterval(this.state.timerInterval);
    const timerBox = document.getElementById('header-timer-box');
    timerBox.classList.add('hidden');
    timerBox.classList.remove('flex');

    // Calculate XP earned
    let correctCount = 0;
    this.state.questions.forEach(q => {
      if (this.state.answers[q.id] === q.answer) correctCount++;
    });
    const earnedXP = correctCount * 15 + 20;
    this.addXP(earnedXP);

    this.state.reviewFilter = 'all';
    this.state.view = 'result';
    this.render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  },

  goHome() {
    this.stopAudio();
    clearInterval(this.state.timerInterval);
    const timerBox = document.getElementById('header-timer-box');
    timerBox.classList.add('hidden');
    timerBox.classList.remove('flex');
    this.state.view = 'home';
    this.render();
  },

  copyStudyNotes() {
    const notes = this.state.questions.map((q, idx) => {
      const userAns = this.state.answers[q.id] || '未作答';
      const isCorrect = userAns === q.answer;
      return `【第 ${idx + 1} 題 - ${q.part}】(${isCorrect ? '答對' : '需複習'})\n重點提示：${q.vocabTip}\n解析：${q.explanation}\n`;
    }).join('\n');

    const fullText = `=== GEPT 中級英檢挑戰賽・專屬複習筆記 ===\n\n${notes}`;
    const textarea = document.createElement('textarea');
    textarea.value = fullText;
    document.body.appendChild(textarea);
    textarea.select();
    try {
      document.execCommand('copy');
      this.showToast('已複製全部重點單字與詳解筆記到剪貼簿！', '📋');
    } catch (e) {
      this.showToast('複製失敗，請手動選取文字複製。', '⚠️');
    }
    document.body.removeChild(textarea);
  },

  /**
   * ==========================================================================
   * VIEW RENDERERS
   * ==========================================================================
   */
  render() {
    const container = document.getElementById('app-container');
    if (this.state.view === 'home') {
      container.innerHTML = this.renderHome();
    } else if (this.state.view === 'quiz') {
      container.innerHTML = this.renderQuiz();
    } else if (this.state.view === 'result') {
      container.innerHTML = this.renderResult();
    }
  },

  renderHome() {
    return `
      <!-- Hero Banner -->

  renderQuiz() {
    const q = this.state.questions[this.state.currentIndex];
    const total = this.state.questions.length;
    const answeredCount = Object.keys(this.state.answers).length;
    const progressPct = Math.round(((this.state.currentIndex + 1) / total) * 100);
    const playsUsed = this.state.playCounts[q.id] || 0;
    const playsLeft = Math.max(0, 2 - playsUsed);

    return `
      <!-- Top Progress & Navigation Bar -->
      <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm mb-6">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
          <div class="flex items-center gap-2">
            <span class="px-3 py-1 rounded-full text-xs font-bold ${q.module === 'listening' ? 'bg-sky-100 text-sky-700' : 'bg-emerald-100 text-emerald-700'}">

            <span class="text-sm font-bold text-slate-700">
              第 ${this.state.currentIndex + 1} / ${total} 題
            </span>
          </div>

          <div class="flex items-center gap-2">
            <button onclick="app.toggleFlag('${q.id}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition flex items-center gap-1 ${this.state.flagged[q.id] ? 'bg-amber-100 border-amber-300 text-amber-800' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}">
              <span>${this.state.flagged[q.id] ? '🚩 已標記待檢查' : '🏳️ 標記此題'}</span>
            </button>
            <button onclick="app.confirmSubmit()" class="px-4 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition">
              交卷看成績 (${answeredCount}/${total})
            </button>
          </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
          <div class="bg-indigo-600 h-full transition-all duration-300" style="width: ${progressPct}%"></div>
        </div>
      </div>

      <!-- Main Question Layout -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- Left / Main Question Card -->
        <div class="lg:col-span-8 space-y-6">
          <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm">
            
            <!-- LISTENING MODULE UI -->
            ${q.module === 'listening' ? `
              <div class="mb-6">
                ${q.svgScene ? `<div class="mb-5">${q.svgScene}</div>` : ''}

                <!-- Audio Player Box -->
                <div class="bg-gradient-to-r from-sky-50 to-indigo-50 border border-sky-200 rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row items-center justify-between gap-4">
                  <div class="flex items-center gap-3.5">
                    <button onclick="app.playQuestionAudio('${q.id}')" ${playsLeft === 0 ? 'disabled' : ''} class="w-12 h-12 rounded-2xl flex items-center justify-center text-white shadow-md transition transform active:scale-95 ${playsLeft > 0 ? 'bg-indigo-600 hover:bg-indigo-700 cursor-pointer' : 'bg-slate-400 cursor-not-allowed'}">
                      <svg class="w-6 h-6 ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/></svg>
                    </button>
                    <div>
                      <div class="font-bold text-slate-900 text-sm sm:text-base flex items-center gap-2">
                        <span>點擊播放聽力題目</span>
                        <span id="audio-wave" class="hidden text-xs bg-indigo-600 text-white px-2 py-0.5 rounded-full animate-pulse">🔊 朗讀中...</span>
                      </div>
                      <p id="play-count-text" class="text-xs text-slate-600 mt-0.5 font-medium">
                        ${playsLeft > 0 ? `剩餘播放次數：${playsLeft} 次（擬真測驗限制）` : '已無剩餘播放次數'}
                      </p>
                    </div>
                  </div>

                  <button onclick="app.toggleSpeechRate()" class="px-3 py-1.5 rounded-xl bg-white border border-slate-200 text-xs font-semibold text-slate-700 hover:bg-slate-50 shadow-xs">
                    語速：${this.state.speechRate === 0.95 ? '1.0x 標準' : '0.8x 慢速'}
                  </button>
                </div>

                <p class="text-sm text-slate-500 mt-4 font-medium">
                  請仔細聆聽語音內容，並選出最適合的答案：
                </p>
              </div>
            ` : ''}

            <!-- READING MODULE UI -->
            ${q.module === 'reading' ? `
              ${q.passageText ? `
                <div class="bg-slate-50 border border-slate-200/90 rounded-2xl p-5 mb-6 max-h-80 overflow-y-auto">
                  <div class="text-xs font-bold uppercase tracking-wider text-indigo-600 mb-1">${q.partEn}</div>
                  <h4 class="font-bold text-slate-900 text-base sm:text-lg mb-3">${q.passageTitle}</h4>
                  <div class="text-slate-700 text-sm sm:text-base leading-relaxed whitespace-pre-line font-normal">
                    ${q.passageText.replace(`__(${q.blankNumber})__`, `<span class="inline-block bg-indigo-100 text-indigo-800 font-extrabold px-2.5 py-0.5 rounded-md border border-indigo-300 mx-1">(${q.blankNumber}) ______</span>`)}
                  </div>
                </div>
              ` : ''}

              <div class="mb-6">
                <p class="text-base sm:text-lg font-bold text-slate-900 leading-relaxed">
                  ${q.questionText}
                </p>
              </div>
            ` : ''}

            <!-- OPTIONS LIST -->
            <div class="space-y-3">
              ${q.options.map(opt => {
                const isSelected = this.state.answers[q.id] === opt.label;
                return `
                  <button onclick="app.selectOption('${q.id}', '${opt.label}')" class="w-full text-left p-4 rounded-2xl border-2 transition-all flex items-start gap-3.5 ${isSelected ? 'border-indigo-600 bg-indigo-50/70 shadow-xs' : 'border-slate-200 hover:border-indigo-300 hover:bg-slate-50'}">
                    <span class="w-7 h-7 rounded-lg flex items-center justify-center text-sm font-extrabold shrink-0 mt-0.5 ${isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}">
                      ${opt.label}
                    </span>
                    <span class="text-sm sm:text-base font-medium ${isSelected ? 'text-indigo-950 font-semibold' : 'text-slate-700'}">
                      ${opt.text}
                    </span>
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Prev / Next Buttons -->
            <div class="flex items-center justify-between mt-8 pt-5 border-t border-slate-100">
              <button onclick="app.goToQuestion(${this.state.currentIndex - 1})" ${this.state.currentIndex === 0 ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl font-semibold text-sm border border-slate-200 transition ${this.state.currentIndex === 0 ? 'text-slate-300 cursor-not-allowed' : 'text-slate-700 hover:bg-slate-50'}">
                ← 上一題
              </button>

              ${this.state.currentIndex < total - 1 ? `
                <button onclick="app.goToQuestion(${this.state.currentIndex + 1})" class="px-6 py-2.5 rounded-xl font-bold text-sm bg-slate-900 hover:bg-slate-800 text-white shadow-sm transition">
                  下一題 →
                </button>
              ` : `
                <button onclick="app.confirmSubmit()" class="px-6 py-2.5 rounded-xl font-bold text-sm bg-emerald-600 hover:bg-emerald-700 text-white shadow-md transition">
                  完成作答・立即交卷 ✓
                </button>
              `}
            </div>
          </div>
        </div>

        <!-- Right Sidebar: Question Navigator Palette -->
        <div class="lg:col-span-4">
          <div class="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm sticky top-24">
            <h4 class="font-bold text-slate-800 text-sm mb-3 flex items-center justify-between">
              <span>🧭 題號快速導覽</span>
              <span class="text-xs text-slate-500 font-normal">已答 ${answeredCount}/${total}</span>
            </h4>

            <div class="grid grid-cols-5 gap-2 mb-4">
              ${this.state.questions.map((item, idx) => {
                const isCurrent = idx === this.state.currentIndex;
                const isAnswered = !!this.state.answers[item.id];
                const isFlagged = !!this.state.flagged[item.id];

                let btnStyle = 'bg-slate-100 text-slate-600 border-transparent';
                if (isCurrent) {
                  btnStyle = 'bg-indigo-600 text-white border-indigo-600 ring-2 ring-indigo-200';
                } else if (isAnswered) {
                  btnStyle = 'bg-emerald-100 text-emerald-800 border-emerald-200 font-bold';
                }

                return `
                  <button onclick="app.goToQuestion(${idx})" class="relative h-10 rounded-xl text-xs font-semibold border transition flex items-center justify-center ${btnStyle}">
                    ${idx + 1}
                    ${isFlagged ? '<span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-amber-500 rounded-full border border-white"></span>' : ''}
                  </button>
                `;
              }).join('')}
            </div>

            <div class="flex flex-wrap gap-3 text-xs text-slate-500 pt-3 border-t border-slate-100">
              <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-indigo-600 inline-block"></span>目前題目</div>
              <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-emerald-100 border border-emerald-300 inline-block"></span>已作答</div>
              <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span>已標記</div>
            </div>
          </div>
        </div>
      </div>
    `;
  },

  renderResult() {
    const total = this.state.questions.length;
    let correctCount = 0;
    const stats = {
      '看圖辨義': { correct: 0, total: 0 },
      '問答': { correct: 0, total: 0 },
      '簡短對話': { correct: 0, total: 0 },
      '詞彙與結構': { correct: 0, total: 0 },
      '段落填空': { correct: 0, total: 0 },
      '閱讀理解': { correct: 0, total: 0 }
    };

    this.state.questions.forEach(q => {
      if (stats[q.part]) stats[q.part].total++;
      if (this.state.answers[q.id] === q.answer) {
        correctCount++;
        if (stats[q.part]) stats[q.part].correct++;
      }
    });

    const percentage = Math.round((correctCount / total) * 100);
    // GEPT Intermediate passing score is roughly 67% (80/120 per section)
    let badgeTitle = '中級潛力新星 🌟';
    let badgeDesc = '你已經具備很好的初級底子！把這次錯題的單字與文法弄懂，離中級通過就更近一步囉！';
    let badgeColor = 'from-amber-500 to-orange-600';

    if (percentage >= 80) {
      badgeTitle = '中級英檢神童級表現 🏆';
      badgeDesc = '太強了！以小六生的年紀達到超過 80% 的正確率，你已經完全具備報考全民英檢中級初試的實力！';
      badgeColor = 'from-emerald-500 to-teal-600';
    } else if (percentage >= 65) {
      badgeTitle = '穩健達標・準中級實力 🎯';
      badgeDesc = '恭喜達到中級及格門檻標準！持續累積閱讀量並熟悉聽力語速，正式考試一定能順利過關！';
      badgeColor = 'from-indigo-600 to-purple-700';
    }

    const filteredQuestions = this.state.questions
      .map((q, idx) => ({ ...q, originalIndex: idx + 1 }))
      .filter(q => {
        if (this.state.reviewFilter === 'wrong') {
          return this.state.answers[q.id] !== q.answer;
        }
        return true;
      });

    return `
      <!-- Score Hero Card -->
      <div class="bg-gradient-to-br ${badgeColor} rounded-3xl p-6 sm:p-8 text-white shadow-xl mb-8">
        <div class="flex flex-col md:flex-row items-center justify-between gap-6">
          <div>
            <span class="inline-block bg-white/20 backdrop-blur-xs px-3 py-1 rounded-full text-xs font-bold mb-3">
              測驗成績單 & 戰力分析
            </span>
            <h2 class="text-2xl sm:text-3xl font-extrabold mb-2">${badgeTitle}</h2>
            <p class="text-white/90 text-sm sm:text-base max-w-xl leading-relaxed">
              ${badgeDesc}
            </p>
          </div>

          <div class="bg-white/15 backdrop-blur-md border border-white/25 rounded-3xl p-5 text-center min-w-[170px] shrink-0">
            <div class="text-xs font-bold uppercase tracking-wider text-white/80">總正確率</div>
            <div class="text-4xl sm:text-5xl font-black my-1">${percentage}%</div>
            <div class="text-xs font-semibold text-white/90">答對 ${correctCount} / ${total} 題</div>
          </div>
        </div>
      </div>

      <!-- Skill Breakdown Grid -->
      <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm mb-8">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
          <h3 class="font-bold text-slate-900 text-lg">📊 各大題型得分分析</h3>
          <div class="flex flex-wrap gap-2">
            <button onclick="app.copyStudyNotes()" class="px-4 py-2 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-xs transition flex items-center gap-1.5">
              <span>📋 複製全部單字文法筆記</span>
            </button>
            <button onclick="app.goHome()" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs transition">
              返回首頁 / 再測一次
            </button>
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
          ${Object.entries(stats).filter(([_, val]) => val.total > 0).map(([partName, val]) => {
            const pct = Math.round((val.correct / val.total) * 100);
            return `
              <div class="bg-slate-50 rounded-2xl p-3.5 border border-slate-100 text-center">
                <div class="text-xs font-bold text-slate-500 mb-1">${partName}</div>
                <div class="text-xl font-extrabold ${pct >= 70 ? 'text-emerald-600' : 'text-amber-600'}">
                  ${val.correct}/${val.total}
                </div>
                <div class="w-full bg-slate-200 h-1.5 rounded-full mt-2 overflow-hidden">
                  <div class="h-full ${pct >= 70 ? 'bg-emerald-500' : 'bg-amber-500'}" style="width: ${pct}%"></div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>

      <!-- Detailed Explanations Section -->
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h3 class="font-bold text-slate-900 text-lg">🧐 逐題詳解與中級單字文法攻略</h3>
        <div class="flex bg-slate-200/80 p-1 rounded-xl text-xs font-bold">
          <button onclick="app.state.reviewFilter='all'; app.render()" class="px-3.5 py-1.5 rounded-lg transition ${this.state.reviewFilter === 'all' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'}">
            顯示全部 (${total})
          </button>
          <button onclick="app.state.reviewFilter='wrong'; app.render()" class="px-3.5 py-1.5 rounded-lg transition ${this.state.reviewFilter === 'wrong' ? 'bg-white text-rose-600 shadow-xs' : 'text-slate-600'}">
            只看錯題 (${total - correctCount})
          </button>
        </div>
      </div>

      ${filteredQuestions.length === 0 ? `
        <div class="bg-white rounded-3xl p-10 text-center border border-slate-200">
          <div class="text-5xl mb-3">🎉</div>
          <h4 class="font-bold text-lg text-slate-900">太厲害了！沒有任何錯題！</h4>
          <p class="text-slate-500 text-sm mt-1">你可以切換回「顯示全部」複習每一題的重點單字喔。</p>
        </div>
      ` : `
        <div class="space-y-5">
          ${filteredQuestions.map(q => {
            const userAns = this.state.answers[q.id];
            const isCorrect = userAns === q.answer;
            return `
              <div class="bg-white rounded-3xl p-6 border-2 ${isCorrect ? 'border-emerald-200' : 'border-rose-200'} shadow-xs">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                  <div class="flex items-center gap-2">
                    <span class="px-2.5 py-1 rounded-lg text-xs font-extrabold ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                      ${isCorrect ? '✓ 答對' : '✕ 需加強'}
                    </span>
                    <span class="font-bold text-slate-800 text-sm">第 ${q.originalIndex} 題 • ${q.part}</span>
                  </div>
                  <div class="text-xs font-bold">
                    你的答案：<span class="${isCorrect ? 'text-emerald-600' : 'text-rose-600'}">${userAns || '未作答'}</span>
                    <span class="mx-1.5 text-slate-300">|</span>
                    正確答案：<span class="text-emerald-600">${q.answer}</span>
                  </div>
                </div>

                <!-- Show Listening Transcript in Review Mode! -->
                ${q.audioScript ? `
                  <div class="bg-sky-50/80 border border-sky-200 rounded-2xl p-4 mb-4 text-sm">
                    <div class="font-bold text-sky-800 text-xs mb-1.5 flex items-center justify-between">
                      <span>🎧 聽力原文逐字稿 (Transcript)：</span>
                      <button onclick="app.playCounts['${q.id}']=0; app.playQuestionAudio('${q.id}')" class="text-indigo-600 hover:underline">🔊 重聽一次</button>
                    </div>
                    <div class="space-y-1 text-slate-700">
                      ${q.audioScript.map(line => `<div><strong class="text-slate-900">${line.speaker}:</strong> ${line.text}</div>`).join('')}
                    </div>
                  </div>
                ` : ''}

                ${q.questionText ? `<p class="font-bold text-slate-900 text-sm sm:text-base mb-3">${q.questionText}</p>` : ''}

                <!-- Options Review -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4 text-xs sm:text-sm">
                  ${q.options.map(opt => {
                    let style = 'bg-slate-50 border-slate-200 text-slate-600';
                    if (opt.label === q.answer) {
                      style = 'bg-emerald-50 border-emerald-400 text-emerald-900 font-bold';
                    } else if (opt.label === userAns && !isCorrect) {
                      style = 'bg-rose-50 border-rose-400 text-rose-900 line-through';
                    }
                    return `
                      <div class="p-2.5 rounded-xl border ${style}">
                        <span class="font-extrabold mr-1.5">(${opt.label})</span> ${opt.text}
                      </div>
                    `;
                  }).join('')}
                </div>

                <!-- Explanation & Vocab Tip -->
                <div class="bg-amber-50/70 border border-amber-200/80 rounded-2xl p-4 text-xs sm:text-sm space-y-2">
                  <div class="text-slate-800 leading-relaxed">
                    <span class="font-bold text-amber-900">💡 題目解析：</span>${q.explanation}
                  </div>
                  <div class="text-indigo-900 leading-relaxed pt-2 border-t border-amber-200/60">
                    <span class="font-bold text-indigo-700">📚 升級中級重點：</span>${q.vocabTip}
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `}
    `;
  }
};

// Boot application
window.addEventListener('DOMContentLoaded', () => {
  // Preload speech synthesis voices if available
  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
  }
  app.init();
});
</script>
</body>
</html>
